name: OSS Autopilot safe repair

on:
  schedule:
    - cron: "37 9 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autopilot-safe-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply approved repairs and validate
        run: python scripts/autopilot.py safe-fix

      - name: Propose a draft pull request when a real repair exists
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/autopilot-ruff-safe-fix
          delete-branch: true
          title: "chore: apply validated Ruff safe fixes"
          commit-message: "chore: apply validated Ruff safe fixes"
          body: |
            Generated by the OSS Autopilot safe-repair workflow.

            Scope is limited to `ruff check --fix app tests scripts`; pytest, Ruff,
            and mypy passed before this draft PR was created. Review before merging.
          draft: true
          labels: |
            autopilot
            needs-maintainer-review
