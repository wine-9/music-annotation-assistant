name: OSS Autopilot observation

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: autopilot-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - id: test
        name: Run tests
        continue-on-error: true
        run: python -m pytest

      - id: lint
        name: Run Ruff
        continue-on-error: true
        run: python -m ruff check .

      - id: typecheck
        name: Run mypy
        continue-on-error: true
        run: python -m mypy app

      - name: Build maintainer digest
        env:
          TEST_RESULT: ${{ steps.test.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
        run: |
          python scripts/autopilot.py observe --check-upstreams \
            --test "$TEST_RESULT" \
            --lint "$LINT_RESULT" \
            --typecheck "$TYPECHECK_RESULT" \
            --report "$RUNNER_TEMP/autopilot-digest.md" \
            --json-report "$RUNNER_TEMP/autopilot-digest.json"
          cat "$RUNNER_TEMP/autopilot-digest.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: maintainer-digest
          path: |
            ${{ runner.temp }}/autopilot-digest.md
            ${{ runner.temp }}/autopilot-digest.json
          if-no-files-found: error

      - name: Create or update a material diagnostic Issue
        uses: actions/github-script@v7
        env:
          REPORT: ${{ runner.temp }}/autopilot-digest.md
          REPORT_JSON: ${{ runner.temp }}/autopilot-digest.json
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_JSON, "utf8"));
            if (!report.action_required) {
              core.info("No material finding; no Issue created.");
              return;
            }

            for (const name of ["autopilot", "needs-maintainer-review"]) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color: name === "autopilot" ? "1d76db" : "fbca04",
                });
              }
            }

            const title = "Autopilot: maintainer attention required";
            const body = fs.readFileSync(process.env.REPORT, "utf8");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "autopilot",
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["autopilot", "needs-maintainer-review"],
              });
              return;
            }

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              per_page: 1,
              sort: "created",
              direction: "desc",
            });
            const latestBody = comments.data[0]?.body ?? existing.body;
            if (latestBody === body) {
              core.info("Diagnostic is unchanged; no duplicate comment created.");
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body,
            });

      - name: Fail when verification failed
        if: steps.test.outcome != 'success' || steps.lint.outcome != 'success' || steps.typecheck.outcome != 'success'
        run: exit 1
