[project]
name = "music-label-assistant"
version = "0.1.0"
description = "Local-first AI-assisted pre-labeling for music audio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "numpy>=1.26,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6,<7",
  "scipy>=1.12,<1.15",
  "soundfile>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "imageio-ffmpeg>=0.5,<1",
]

[project.optional-dependencies]
model = ["essentia-tensorflow==2.1b6.dev1389"]
separation = ["demucs>=4,<5"]
evaluation = [
  "aiohttp>=3.11,<4",
  "fsspec>=2025.3,<2027",
  "pyarrow>=18,<24",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
music-label-assistant = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["model: requires real model weights", "integration: integration test"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_evaluation.py" = ["RUF001"]
"scripts/generate_usability_report.py" = ["RUF001"]
"scripts/generate_product_validation_report.py" = ["RUF001"]
"app/decision/form_mapper.py" = ["RUF001"]
"app/api/routes.py" = ["RUF001"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["app"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["essentia", "essentia.*", "imageio_ffmpeg", "scipy", "scipy.*", "soundfile"]
ignore_missing_imports = true
